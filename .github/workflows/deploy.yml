name: Despliegue a Ferozo

on:
  push:
    branches:
      - main  # Rama principal
      - prueba
  workflow_dispatch:   # Permite lanzar el despliegue a mano desde la pestaña Actions

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    # Le agrega ?v=<hash del commit> a cada CSS y JS propio referenciado en los
    # HTML. Así el navegador y Cloudflare ven una URL distinta en cada despliegue
    # y no pueden servir una copia vieja, aunque falle la purga de caché.
    - name: Versionar CSS y JS (cache busting)
      run: |
        python3 - <<'PY'
        import pathlib, re, os

        sha = os.environ['GITHUB_SHA'][:8]
        pattern = re.compile(r'(\b(?:href|src)=")(?!https?:|//)([^"?#]+\.(?:css|js))(")')
        total = 0

        for path in [*pathlib.Path('.').glob('*.html'), *pathlib.Path('modelos').glob('*.html')]:
            text = path.read_text(encoding='utf-8')
            new_text, n = pattern.subn(rf'\g<1>\g<2>?v={sha}\g<3>', text)
            if n:
                path.write_text(new_text, encoding='utf-8')
                total += n
                print(f'{path}: {n} referencias versionadas')

        print(f'Total: {total} referencias con ?v={sha}')
        PY

    # Sitemap para Google con una URL por producto, al día con productos.json
    - name: Generar sitemap.xml
      run: python3 scripts/gen_sitemap.py

    - name: Definir carpeta de destino según la rama
      id: target
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "dir=./public_html/" >> "$GITHUB_OUTPUT"
        else
          echo "dir=./public_html/${{ github.ref_name }}/" >> "$GITHUB_OUTPUT"
          cat > .htaccess <<'HT'
        <IfModule mod_headers.c>
          Header set X-Robots-Tag "noindex, nofollow"
        </IfModule>
        HT
        fi

    # El FTP de Ferozo a veces rechaza la conexión de datos ("ECONNREFUSED
    # ...:50000") y al rato vuelve a andar: se reintenta solo hasta 3 veces.
    - name: Sync files
      id: sync1
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ steps.target.outputs.dir }}  # Ajustá esto según la carpeta de tu hosting
        protocol: ftps
        # Con los 30 s por defecto el hosting cortaba la conexión a mitad
        # ("Timeout (control socket)", "Server sent FIN packet unexpectedly")
        timeout: 120000
        # Las pruebas y docs internas no van al hosting (los tres primeros son los que excluye por defecto)
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          PRODUCT.md
          DESIGN.md
          .impeccable/**

    - name: Esperar antes de reintentar
      if: steps.sync1.outcome == 'failure'
      run: sleep 60

    - name: Sync files (reintento 1)
      id: sync2
      if: steps.sync1.outcome == 'failure'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ steps.target.outputs.dir }}  # Ajustá esto según la carpeta de tu hosting
        protocol: ftps
        # Con los 30 s por defecto el hosting cortaba la conexión a mitad
        # ("Timeout (control socket)", "Server sent FIN packet unexpectedly")
        timeout: 120000
        # Las pruebas y docs internas no van al hosting (los tres primeros son los que excluye por defecto)
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          PRODUCT.md
          DESIGN.md
          .impeccable/**

    - name: Esperar antes del ultimo intento
      if: steps.sync1.outcome == 'failure' && steps.sync2.outcome == 'failure'
      run: sleep 120

    - name: Sync files (reintento 2)
      if: steps.sync1.outcome == 'failure' && steps.sync2.outcome == 'failure'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ${{ steps.target.outputs.dir }}  # Ajustá esto según la carpeta de tu hosting
        protocol: ftps
        # Con los 30 s por defecto el hosting cortaba la conexión a mitad
        # ("Timeout (control socket)", "Server sent FIN packet unexpectedly")
        timeout: 120000
        # Las pruebas y docs internas no van al hosting (los tres primeros son los que excluye por defecto)
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          PRODUCT.md
          DESIGN.md
          .impeccable/**

    # No hace falta purgar la caché: el sello ?v=<hash> de arriba hace que cada
    # despliegue tenga URLs nuevas para CSS y JS. El Cloudflare del dominio es el
    # del hosting (Ferozo), no una cuenta propia.
