name: Despliegue a Ferozo

on:
  push:
    branches:
      - main  # Rama principal
      - prueba
  workflow_dispatch:   # Permite lanzar el despliegue a mano desde la pestaña Actions

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    # Le agrega ?v=<hash del commit> a cada CSS y JS propio referenciado en los
    # HTML. Así el navegador y Cloudflare ven una URL distinta en cada despliegue
    # y no pueden servir una copia vieja, aunque falle la purga de caché.
    - name: Versionar CSS y JS (cache busting)
      run: |
        python3 - <<'PY'
        import pathlib, re, os

        sha = os.environ['GITHUB_SHA'][:8]
        pattern = re.compile(r'(\b(?:href|src)=")(?!https?:|//)([^"?#]+\.(?:css|js))(")')
        total = 0

        for path in [*pathlib.Path('.').glob('*.html'), *pathlib.Path('modelos').glob('*.html')]:
            text = path.read_text(encoding='utf-8')
            new_text, n = pattern.subn(rf'\g<1>\g<2>?v={sha}\g<3>', text)
            if n:
                path.write_text(new_text, encoding='utf-8')
                total += n
                print(f'{path}: {n} referencias versionadas')

        print(f'Total: {total} referencias con ?v={sha}')
        PY

    # Sitemap para Google con una URL por producto, al día con productos.json
    - name: Generar sitemap.xml
      run: python3 scripts/gen_sitemap.py

    # ══════════ Rama main -> Producción (./public_html/) ══════════
    - name: Sync files (main)
      id: sync1
      if: github.ref_name == 'main'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./public_html/
        protocol: ftps
        timeout: 120000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          PRODUCT.md
          DESIGN.md
          .impeccable/**

    - name: Esperar antes de reintentar (main)
      if: github.ref_name == 'main' && steps.sync1.outcome == 'failure'
      run: sleep 60

    - name: Sync files reintento 1 (main)
      id: sync2
      if: github.ref_name == 'main' && steps.sync1.outcome == 'failure'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./public_html/
        protocol: ftps
        timeout: 120000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          PRODUCT.md
          DESIGN.md
          .impeccable/**

    - name: Esperar antes del ultimo intento (main)
      if: github.ref_name == 'main' && steps.sync1.outcome == 'failure' && steps.sync2.outcome == 'failure'
      run: sleep 120

    - name: Sync files reintento 2 (main)
      if: github.ref_name == 'main' && steps.sync1.outcome == 'failure' && steps.sync2.outcome == 'failure'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./public_html/
        protocol: ftps
        timeout: 120000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          PRODUCT.md
          DESIGN.md
          .impeccable/**

    # ══════════ Rama de prueba -> Subcarpeta aislada por lotes cortos ══════════
    - name: Preparar .htaccess para entorno de prueba
      if: github.ref_name != 'main'
      run: |
        cat > .htaccess <<'HT'
        <IfModule mod_headers.c>
          Header set X-Robots-Tag "noindex, nofollow"
        </IfModule>
        <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteRule ^imagenes/(.*)$ /imagenes/$1 [L]
        </IfModule>
        HT

    - name: Lote 1 - Núcleo web, ERP, API y productos.json
      id: core1
      if: github.ref_name != 'main'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./public_html/${{ github.ref_name }}/
        state-name: .ftp-deploy-sync-state-core.json
        protocol: ftps
        timeout: 120000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          scripts/**
          imagenes/**
          PRODUCT.md
          DESIGN.md
          .impeccable/**

    - name: Esperar si reintenta Lote 1
      if: github.ref_name != 'main' && steps.core1.outcome == 'failure'
      run: sleep 30

    - name: Lote 1 reintento - Núcleo web, ERP, API y productos.json
      if: github.ref_name != 'main' && steps.core1.outcome == 'failure'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./public_html/${{ github.ref_name }}/
        state-name: .ftp-deploy-sync-state-core.json
        protocol: ftps
        timeout: 120000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          tests/**
          scripts/**
          imagenes/**
          PRODUCT.md
          DESIGN.md
          .impeccable/**

    - name: Lote 2 - Imágenes nivel raíz
      if: github.ref_name != 'main'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./imagenes/
        server-dir: ./public_html/${{ github.ref_name }}/imagenes/
        state-name: .ftp-deploy-sync-state-img-root.json
        protocol: ftps
        timeout: 120000
        exclude: |
          Fotos Nuevas/**
          Fotos Productos/**

    - name: Lote 3 - Imágenes Fotos Nuevas
      if: github.ref_name != 'main'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./imagenes/Fotos Nuevas/
        server-dir: ./public_html/${{ github.ref_name }}/imagenes/Fotos Nuevas/
        state-name: .ftp-deploy-sync-state-img-nuevas.json
        protocol: ftps
        timeout: 120000

    - name: Lote 4 - Imágenes Fotos Productos
      if: github.ref_name != 'main'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./imagenes/Fotos Productos/
        server-dir: ./public_html/${{ github.ref_name }}/imagenes/Fotos Productos/
        state-name: .ftp-deploy-sync-state-img-prod.json
        protocol: ftps
        timeout: 120000
