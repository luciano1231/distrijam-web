<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Modelos de portada | Distrijam</title>
  <link rel="icon" type="image/png" href="../Logo/logo-distrijam.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0b0f19; }
    /* El modelo ocupa toda la pantalla; el selector flota encima sin quitar lugar */
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

    .sel {
      position: fixed; left: 50%; bottom: 10px; translate: -50% 0; z-index: 10;
      display: flex; align-items: center; gap: 2px; padding: 3px;
      font: 600 11px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: rgba(15, 17, 21, .55); border: 1px solid rgba(255, 255, 255, .12); border-radius: 999px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: .35; transition: opacity .2s ease;
    }
    .sel:hover, .sel:focus-within { opacity: 1; }
    .sel button, .sel a {
      height: 22px; min-width: 26px; padding: 0 7px; border: 0; border-radius: 999px;
      background: transparent; color: rgba(255, 255, 255, .75); font: inherit; cursor: pointer;
      display: grid; place-items: center; text-decoration: none;
    }
    .sel button:hover, .sel a:hover { color: #fff; background: rgba(255, 255, 255, .1); }
    .sel button[aria-pressed="true"] { background: #fff; color: #111; }
    .sel i { width: 1px; height: 12px; background: rgba(255, 255, 255, .18); margin: 0 3px; }
  </style>
</head>
<body>
  <iframe id="frame" src="index-m3.html" title="Vista previa del modelo"></iframe>

  <nav class="sel" aria-label="Elegir modelo">
    <button type="button" data-m="m1" title="Modelo 1: Portal e-commerce">M1</button>
    <button type="button" data-m="m2" title="Modelo 2: Dark inmersivo">M2</button>
    <button type="button" data-m="m3" title="Modelo 3: Cine">M3</button>
    <button type="button" data-m="m4" title="Modelo 4: Vitrina">M4</button>
    <button type="button" data-m="m5" title="Modelo 5: Muro">M5</button>
    <i></i>
    <button type="button" id="view" title="Ver el catálogo con este modelo">Catálogo</button>
    <a id="open" href="index-m3.html" target="_blank" rel="noopener" title="Abrir en pestaña nueva" aria-label="Abrir en pestaña nueva">↗</a>
  </nav>

  <script>
    const MODELOS = ['m1', 'm2', 'm3', 'm4', 'm5'];
    const frame = document.getElementById('frame');
    const viewBtn = document.getElementById('view');
    const open = document.getElementById('open');
    const btns = [...document.querySelectorAll('[data-m]')];

    // El modelo elegido queda en la dirección (#m4) para compartirlo o recargar
    let modelo = MODELOS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'm3';
    let catalogo = false;

    function mostrar() {
      localStorage.setItem('distrijam_version', modelo);
      const url = catalogo ? `../catalogo.html?ver=${modelo}` : `index-${modelo}.html`;
      if (!frame.src.endsWith(url.replace('../', ''))) frame.src = url;
      open.href = url;
      btns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === modelo)));
      viewBtn.textContent = catalogo ? 'Portada' : 'Catálogo';
      viewBtn.title = catalogo ? 'Volver a la portada del modelo' : 'Ver el catálogo con este modelo';
      history.replaceState(null, '', `#${modelo}`);
    }

    btns.forEach(b => b.addEventListener('click', () => { modelo = b.dataset.m; mostrar(); }));
    viewBtn.addEventListener('click', () => { catalogo = !catalogo; mostrar(); });
    mostrar();
  </script>
</body>
</html>
